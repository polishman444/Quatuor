<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EEF0F7">
<title>Quatuor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quatuor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F7; --card:#FFFFFF; --edge:#CDD2E3; --ink:#1B2040; --muted:#6B7190; --sel:#1B2040; --sel-ink:#FFFFFF; --sheet:#FFFFFF;
  /* 4 niveaux : Facile, Réflexion, Coriace, Casse-tête */
  --l0:#45D0B0; --l0e:#27A085; --l1:#FFA552; --l1e:#D27B26; --l2:#EF5B7C; --l2e:#BF3A59; --l3:#2E3A87; --l3e:#18204F;
  --font:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#12152A; --card:#252A48; --edge:#0A0C1B; --ink:#F1F2FA; --muted:#9AA0C0; --sel:#F1F2FA; --sel-ink:#12152A; --sheet:#1C2039; --l3:#4A58C2; --l3e:#2A347F; }
}
:root[data-theme="dark"]{ --bg:#12152A; --card:#252A48; --edge:#0A0C1B; --ink:#F1F2FA; --muted:#9AA0C0; --sel:#F1F2FA; --sel-ink:#12152A; --sheet:#1C2039; --l3:#4A58C2; --l3e:#2A347F; }
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;overscroll-behavior-y:none}
html.lock,html.lock body{overflow:hidden}
/* Pas de zoom au double-tap (iPhone) */
html,body,button{touch-action:manipulation}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:10px 16px 110px;min-height:100svh;display:flex;flex-direction:column}
.area{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:10px}

.top{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{display:flex;align-items:center;gap:8px}
.brand .ibtn{margin-left:-8px}
.mark{display:grid;grid-template-columns:repeat(2,11px);gap:3px}
.mark i{width:11px;height:11px;border-radius:3px;display:block}
.mark i:nth-child(1){background:var(--l0)} .mark i:nth-child(2){background:var(--l1)}
.mark i:nth-child(3){background:var(--l2)} .mark i:nth-child(4){background:var(--l3)}
h1{margin:0;font-size:1.65rem;font-weight:800;letter-spacing:-.03em}
.icons{display:flex;gap:6px}
.ibtn{width:42px;height:42px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{background:var(--edge)}
.sub{margin:4px 2px 14px;color:var(--muted);font-weight:500}
.sub b{color:var(--ink);font-weight:650}

.stack{display:grid;gap:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{position:relative;border:0;border-radius:14px;background:var(--card);box-shadow:0 4px 0 var(--edge);aspect-ratio:1/1;padding:4px;cursor:pointer;
  display:grid;place-items:center;text-align:center;font-weight:650;line-height:1.08;word-break:keep-all;overflow:hidden;
  transition:transform .12s ease, box-shadow .12s ease, background .12s, color .12s}
.tile span{display:block;max-width:100%}
.tile.sk{cursor:default;animation:skp 1.1s ease-in-out infinite alternate;animation-delay:calc(var(--i)*45ms)}
@keyframes skp{from{opacity:.45}to{opacity:1}}
.gempty{margin:6px 0;padding:18px 12px;text-align:center;color:var(--muted);border:1.5px dashed var(--edge);border-radius:14px;font-size:.92rem}
.loaderr{grid-column:1/-1;text-align:center;padding:28px 12px;color:var(--muted)}
.loaderr .pill{flex:none;width:auto;padding:0 28px;margin-top:8px}
.tile span.hy{-webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere}
.tile.on{background:var(--sel);color:var(--sel-ink);transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
/* Effet ressort à la sélection : la tuile s'enfonce puis rebondit */
.tile.spring{animation:sprOff .45s cubic-bezier(.25,.8,.35,1) both}
.tile.on.spring{animation:sprOn .45s cubic-bezier(.25,.8,.35,1) both}
@keyframes sprOn{0%{transform:none}40%{transform:translateY(4px) scale(.96)}100%{transform:translateY(3px)}}
@keyframes sprOff{0%{transform:translateY(3px)}40%{transform:translateY(1px) scale(1.015)}100%{transform:none}}
.tile.jump{animation:jump .42s ease-in-out both;animation-delay:calc(var(--i)*70ms)}
.tile.shake{animation:shake .5s ease-in-out}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#E5484D;opacity:0;pointer-events:none}
.tile.shake::after{animation:flash .6s ease-out}
@keyframes jump{0%,100%{transform:translateY(3px)}50%{transform:translateY(-8px) scale(1.02)}}
@keyframes shake{0%,100%{transform:translate(0,3px)}20%{transform:translate(-4px,3px)}40%{transform:translate(4px,3px)}60%{transform:translate(-2.5px,3px)}80%{transform:translate(2px,3px)}}
@keyframes flash{0%{opacity:0}20%{opacity:.3}100%{opacity:0}}
/* Tuiles qui volent vers le bandeau, particules, confettis */
.ghost{position:fixed;margin:0;z-index:15;pointer-events:none;transition:none;animation:none;transform-origin:0 0}
.spark,.confetti,.fall{position:fixed;display:block;pointer-events:none;z-index:25}
.spark{width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:3px}
.confetti{top:-18px;border-radius:2px}
.fall{border-radius:4px;background:var(--ink);z-index:5}

/* Groupe trouvé + anecdote */
.solved{border:0;width:100%;border-radius:14px;padding:12px 14px 11px;text-align:center;cursor:pointer;display:block;font:inherit}
.solved.pop{animation:land .5s cubic-bezier(.25,.8,.35,1) both}
.solved.pre{opacity:0}
.solved .lvl{font-size:.78rem;font-weight:650;opacity:.8}
.solved strong{display:block;font-size:1.02rem;font-weight:800;letter-spacing:-.01em;margin-top:1px}
.solved .w{display:block;font-size:.92rem;font-weight:500;margin-top:2px}
.fact{display:grid;grid-template-rows:0fr}
.fact>div{overflow:hidden}
.fact p{position:relative;margin:10px 0 2px;padding:10px 40px 10px 12px;border-radius:10px;background:rgba(255,255,255,.28);font-size:.92rem;font-weight:500;line-height:1.35;text-align:left}
.solved.open .fact{grid-template-rows:1fr}
.solved.open .fact p{animation:factIn .6s cubic-bezier(.25,.8,.35,1) both}
@keyframes factIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.solved .more{display:block;font-size:.78rem;font-weight:650;margin-top:5px;opacity:.75}
.solved.open .more{display:none}
.l0{background:var(--l0);box-shadow:0 4px 0 var(--l0e);color:#082A22}
.l1{background:var(--l1);box-shadow:0 4px 0 var(--l1e);color:#3A1E02}
.l2{background:var(--l2);box-shadow:0 4px 0 var(--l2e);color:#fff}
.l3{background:var(--l3);box-shadow:0 4px 0 var(--l3e);color:#fff}
@keyframes land{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}

.lives{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0 0;color:var(--muted);font-size:.95rem;font-weight:500}
.lives .dots{display:flex;gap:6px}
.lives i{width:14px;height:14px;border-radius:4px;background:var(--ink);display:block;transition:transform .25s, opacity .25s}
.lives i.off{opacity:.15;transform:scale(.7)}
.lives i.lose{animation:deflate .7s ease-in-out both}
@keyframes deflate{0%{transform:none;opacity:1}30%{transform:scale(1.12)}100%{transform:scale(.7);opacity:.15}}
.round.spin svg{animation:spin .6s cubic-bezier(.25,.8,.35,1)}
@keyframes spin{from{transform:rotate(-180deg)}to{transform:none}}

.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top, var(--bg) 70%, transparent)}
.dock-in{max-width:480px;margin:0 auto;display:flex;gap:10px;align-items:center}
.round{flex:none;width:54px;height:54px;border-radius:50%;border:0;background:var(--card);box-shadow:0 4px 0 var(--edge);display:grid;place-items:center;cursor:pointer}
.round svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{flex:1;height:54px;border-radius:27px;border:0;font-size:1.08rem;font-weight:800;cursor:pointer;transition:transform .1s, box-shadow .1s, opacity .15s}
.pill.main{background:var(--ink);color:var(--bg);box-shadow:0 4px 0 #000}
.pill.soft{background:var(--card);box-shadow:0 4px 0 var(--edge)}
.round:active,.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.pill:disabled,.round:disabled{opacity:.35;cursor:default;transform:none}
button:focus-visible{outline:3px solid var(--l2);outline-offset:3px}

.veil{position:fixed;inset:0;background:rgba(10,12,28,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.veil.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);border-radius:24px 24px 0 0;
  padding:10px 22px calc(24px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;transform:translateY(105%);
  transition:transform .35s cubic-bezier(.4,0,.6,1);max-height:88vh;overflow:auto;box-shadow:0 60px 0 var(--sheet);
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;will-change:transform}
.sheet.open{transform:translateY(0);transition:transform .55s cubic-bezier(.22,1.08,.4,1)}
/* Poignée : zone de saisie plus grande que le trait visible */
.grab{position:relative;width:40px;height:5px;border-radius:3px;background:var(--edge);margin:0 auto 14px;cursor:grab}
.grab::before{content:"";position:absolute;left:-60px;right:-60px;top:-12px;bottom:-12px}

/* Fin de partie : boutons « Voir mes résultats » / « Grille suivante » */
.dock .end{display:none}
.dock.over .end{display:block}
.dock.over .play{display:none}
.dock .end.pill{font-size:1rem;white-space:nowrap;padding:0 10px;min-width:0;overflow:hidden;text-overflow:ellipsis}

/* Bulle du tutoriel */
.tuto{position:relative;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 15px;margin:0 0 16px;
  font-weight:650;font-size:.98rem;line-height:1.32;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.tuto::after{content:"";position:absolute;left:50%;bottom:-7px;width:16px;height:16px;margin-left:-8px;background:var(--ink);transform:rotate(45deg);border-radius:3px}
.tuto .go{display:block;width:100%;margin-top:11px;height:48px;border-radius:24px;border:0;background:var(--bg);color:var(--ink);font:inherit;font-weight:800;font-size:1.02rem;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.tuto .go:active{transform:translateY(2px);box-shadow:none}
.sub.tsub{display:flex;align-items:center;justify-content:space-between;gap:8px}
.skip{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.88rem;font-weight:650;text-decoration:underline;text-underline-offset:3px;padding:8px 0 8px 8px;cursor:pointer}

/* Pop-up de bienvenue */
.wel h2{margin:0}
.whead{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.whead .mark{grid-template-columns:repeat(2,15px);gap:4px}
.whead .mark i{width:15px;height:15px;border-radius:4px}
.whead p{margin:2px 0 0}
.whero{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--bg);border-radius:16px;padding:12px;margin-bottom:8px}
.m16{display:grid;grid-template-columns:repeat(4,13px);gap:3px}
.m16 i{width:13px;height:13px;border-radius:3px;background:var(--card);box-shadow:0 2px 0 var(--edge)}
.m4{display:grid;gap:4px}
.m4 i{display:block;width:60px;height:10px;border-radius:3px;box-shadow:none}
.whero .arr{font-weight:800;color:var(--muted)}
.wel .whero p{margin:0;color:var(--ink);font-size:.95rem;line-height:1.25}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.wc{background:var(--bg);border-radius:14px;padding:10px 10px 9px;font-size:.84rem;line-height:1.28;color:var(--ink)}
.wc .v{display:flex;align-items:center;justify-content:center;gap:4px;min-height:40px;margin-bottom:6px;flex-wrap:wrap}
.mt{display:inline-grid;place-items:center;height:24px;padding:0 6px;border-radius:6px;background:var(--card);box-shadow:0 2px 0 var(--edge);font-weight:700;font-size:.7rem;color:var(--ink)}
.mt.on{background:var(--sel);color:var(--sel-ink);box-shadow:none;transform:translateY(2px)}
.mt.ok{background:var(--ink);color:var(--bg);box-shadow:none;border-radius:999px;padding:0 9px}
.wc .err{display:grid;grid-template-columns:auto auto;gap:4px 7px;align-items:center;font-size:.72rem;font-weight:650;text-align:left}
.wc .dd{display:flex;gap:3px}
.wc .dd i{width:9px;height:9px;border-radius:3px;background:var(--ink)}
.wband{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;font-weight:800;font-size:.75rem;box-shadow:none}
.wband{white-space:nowrap}
@media (max-width:360px){ .whero{gap:8px} .m16{grid-template-columns:repeat(4,9px);gap:2px} .m16 i{width:9px;height:9px}
  .m4 i{width:36px;height:8px} .wel .whero p{font-size:.85rem} .wc{font-size:.8rem} }
.wchk{display:flex;align-items:center;gap:10px;padding:8px 2px 12px;font-weight:650;color:var(--muted);cursor:pointer}
.wchk input{width:22px;height:22px;margin:0;accent-color:var(--ink)}
.sheet h2{margin:0 0 6px;font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.sheet h3{margin:18px 0 8px;font-size:1.1rem;font-weight:800}
.sheet p{margin:0 0 10px;color:var(--muted)}
.sheet p.lead{color:var(--ink);font-size:1.05rem;margin:4px 0 12px}
.rule{display:flex;gap:12px;align-items:center;margin:10px 0}
.rule .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--bg);color:var(--ink)}
/* Légende des couleurs : purement informative, rien de cliquable */
.legend{margin:18px 0 20px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--edge)}
.legend .t{display:block;font-size:.85rem;font-weight:650;color:var(--muted);margin-bottom:8px}
.legend .sw{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:.8rem;font-weight:650}
.legend .sw i{display:block;width:18px;height:18px;border-radius:5px;margin:0 auto 4px;box-shadow:none}
.legend .ax{display:flex;justify-content:space-between;margin-top:6px;font-size:.75rem;color:var(--muted)}
.recap{display:grid;gap:4px;justify-content:center;margin:14px 0 16px}
.recap div{display:flex;gap:4px}
.recap i{width:26px;height:26px;border-radius:7px;display:block;animation:sq .45s cubic-bezier(.25,1.2,.4,1) both;animation-delay:calc(.4s + var(--k)*50ms)}
@keyframes sq{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.learned{display:grid;gap:8px;margin-bottom:18px}
.learned div{position:relative;border-left:5px solid;padding:6px 40px 6px 12px;font-size:.93rem;line-height:1.35}
.learned b{display:block;font-size:.85rem}
.learned .b0{border-color:var(--l0)} .learned .b1{border-color:var(--l1)} .learned .b2{border-color:var(--l2)} .learned .b3{border-color:var(--l3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 20px;text-align:center}
.stats b{display:block;font-size:1.7rem;font-weight:800;line-height:1.1}
.stats small{color:var(--muted);font-size:.8rem}
.row{display:flex;gap:10px}

/* Tiroir des grilles */
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:21;width:min(86vw,360px);background:var(--sheet);
  padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateX(-102%);transition:transform .32s cubic-bezier(.4,0,.6,1);overflow:auto;border-radius:0 22px 22px 0;box-shadow:-60px 0 0 var(--sheet)}
.drawer.open{transform:translateX(0);transition:transform .5s cubic-bezier(.22,1.06,.4,1)}
.drawer h2{margin:0 0 -4px;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
/* Onglets du tiroir : Grilles / Mon carnet */
.mtabs{display:grid;grid-template-columns:1fr 1.4fr;gap:4px;padding:4px;border-radius:14px;background:var(--bg);margin-bottom:4px}
.mtab{border:0;background:transparent;border-radius:11px;padding:9px 4px;font:inherit;font-weight:800;font-size:.95rem;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.mtab.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--edge)}
.mtab .cnt{display:inline-block;min-width:22px;padding:1px 7px;margin-left:3px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:.72rem;vertical-align:2px}
/* Étoile des favoris */
.star{position:absolute;top:3px;right:3px;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;cursor:pointer;
  font-size:1.3rem;line-height:1;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.star:focus-visible{outline:3px solid var(--l2);outline-offset:1px}
.learned .star.on,.fcard .star.on{color:var(--l1e)}
.star.bounce{animation:starPop .5s cubic-bezier(.25,.8,.35,1)}
@keyframes starPop{0%{transform:none}35%{transform:scale(1.35) rotate(-10deg)}70%{transform:scale(.94)}100%{transform:none}}
/* Mon carnet */
.flist{display:grid;gap:12px;margin-top:14px}
.fcard{position:relative;background:var(--card);border-radius:14px;box-shadow:0 3px 0 var(--edge);padding:12px 44px 12px 14px;border-left:6px solid var(--l0)}
.fcard.c1{border-left-color:var(--l1)} .fcard.c2{border-left-color:var(--l2)} .fcard.c3{border-left-color:var(--l3)}
.fcard b{display:block;font-weight:800;line-height:1.2}
.fcard small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.fcard p{margin:8px 0 10px;font-size:.93rem;line-height:1.38}
.fshare{border:0;border-radius:999px;padding:7px 13px;font:inherit;font-size:.85rem;font-weight:700;background:var(--bg);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--edge);display:inline-flex;align-items:center;gap:6px}
.fshare svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fshare:active{transform:translateY(2px);box-shadow:none}
.fshare:disabled{opacity:.5}
.fempty{text-align:center;padding:36px 12px;color:var(--muted);line-height:1.4}
.fempty span{display:block;font-size:2.6rem;margin-bottom:8px;color:var(--ink)}
.prog{margin:4px 0 14px;color:var(--muted);font-weight:500}
.prog b{color:var(--ink)}
.drawer .sec{margin:16px 0 8px;font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.dtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.dtab{border:0;border-radius:12px;padding:8px 2px 7px;background:var(--bg);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .2s}
.dtab i{width:12px;height:12px;border-radius:4px;box-shadow:none;display:block}
.dtab b{font-size:.8rem;font-weight:700;white-space:nowrap}
.dtab small{font-size:.72rem;color:var(--muted)}
.dtab.on{background:var(--ink);color:var(--bg)}
.dtab.on small{color:var(--bg);opacity:.7}
.dtab:active{transform:scale(.96)}
.dbadge{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;box-shadow:none;vertical-align:1px}
.bar{height:8px;border-radius:4px;background:var(--edge);overflow:hidden;margin:-6px 0 16px}
.bar i{display:block;height:100%;background:var(--l0);border-radius:4px}
.glist{display:grid;gap:8px}
.gitem{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--bg);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit}
.gitem.cur{outline:2.5px solid var(--ink)}
.gitem .num{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--card);box-shadow:0 3px 0 var(--edge)}
.gitem.win .num{background:var(--l0);color:#082A22;box-shadow:0 3px 0 var(--l0e)}
.gitem.lost .num{background:var(--l2);color:#fff;box-shadow:0 3px 0 var(--l2e)}
/* Réussie après un nouvel essai : ✓ avec un petit 🔄 */
.gitem .num{position:relative}
.gitem.win2 .num{background:var(--l0);color:#082A22;box-shadow:0 3px 0 var(--l0e)}
.gitem.win2 .num::after{content:"🔄";position:absolute;right:-7px;top:-7px;font-size:.62rem;width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:var(--card);box-shadow:0 1px 0 var(--edge)}
.grow{position:relative}
.grow.can .gitem{padding-right:104px}
.gretry{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;border-radius:999px;padding:7px 11px;font:inherit;font-size:.8rem;font-weight:800;
  background:var(--l2);color:#fff;box-shadow:0 3px 0 var(--l2e);cursor:pointer;white-space:nowrap}
.gretry:active{transform:translateY(calc(-50% + 2px));box-shadow:0 1px 0 var(--l2e)}
.grow.can .tag{display:none}
/* Grille au hasard */
.rand{background:var(--bg);border-radius:16px;padding:12px}
.rpills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.rpill{border:0;border-radius:999px;padding:7px 11px 7px 9px;font:inherit;font-size:.82rem;font-weight:700;background:var(--card);color:var(--ink);
  box-shadow:0 2px 0 var(--edge);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .2s}
.rpill i{width:11px;height:11px;border-radius:3px;box-shadow:none;display:block}
.rpill .all{display:grid;grid-template-columns:repeat(2,5px);gap:1px;width:auto;height:auto;background:none}
.rpill .all b{width:5px;height:5px;border-radius:1.5px;display:block}
.rpill.on{background:var(--ink);color:var(--bg);box-shadow:0 2px 0 #000}
.rpill:active{transform:scale(.95)}
.rgo{width:100%;height:50px;display:flex;align-items:center;justify-content:center;gap:8px}
.rgo .die{display:inline-block;font-size:1.25rem}
.pill.full{width:100%;margin-bottom:10px}
.dock .pend{display:none}
.dock.over.pending .pend{display:block}
.dock.over.pending .end{display:none}
.pill.full+.pill.full{margin-top:-2px}
.dock .end.lostonly{display:none}
.dock.over.lost .lostonly{display:grid}
.dock .sm{display:none}
@media (max-width:420px){ .dock.lost .lg{display:none} .dock.lost .sm{display:inline} }
.gitem .txt{flex:1;min-width:0}
.gitem b{display:block;font-weight:700}
.gitem small{color:var(--muted);font-size:.85rem}
.tag{flex:none;font-size:.75rem;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:12px;font-weight:650;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;transition-duration:1ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><button class="ibtn" id="menuBtn" aria-label="Toutes les grilles"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1>Quatuor</h1></div>
    <div class="icons">
      <button class="ibtn" id="helpBtn" aria-label="Règles du jeu"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 1c0 1.8-2.5 2.2-2.5 3.8"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></svg></button>
      <button class="ibtn" id="statsBtn" aria-label="Statistiques"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg></button>
    </div>
  </header>
  <div class="sub" id="sub"></div>
  <div class="area">
    <div class="tuto" id="tuto" hidden><span id="tutoTxt"></span></div>
    <div class="stack">
      <div class="stack" id="solved"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="lives" id="lives">Erreurs restantes <span class="dots"></span></div>
  </div>
</div>

<nav class="dock"><div class="dock-in">
  <button class="round play" id="shuffle" aria-label="Mélanger"><svg viewBox="0 0 24 24"><path d="M4 7h3.5c4 0 5 10 9 10H20M4 17h3.5c1.6 0 2.7-1.6 3.6-3.5M20 7h-3.5c-1.6 0-2.7 1.6-3.6 3.5M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5"/></svg></button>
  <button class="pill soft play" id="clear" disabled>Effacer</button>
  <button class="pill main play" id="submit" disabled>Valider</button>
  <button class="pill main pend" id="retryP">Réessayer 🔄</button>
  <button class="pill soft pend" id="revealP">Voir la solution</button>
  <button class="round end lostonly" id="retryD" aria-label="Retenter"><span style="font-size:1.35rem">🔄</span></button>
  <button class="pill main end" id="seeRes"><span class="lg">Voir mes résultats</span><span class="sm">Résultats</span></button>
  <button class="pill soft end" id="nextG"><span class="lg">Grille suivante</span><span class="sm">Suivante</span></button>
</div></nav>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<nav class="drawer" id="drawer" aria-label="Toutes les grilles"></nav>
<div class="toast" id="toast"></div>

<script>
// Chaque grille : 4 groupes du plus facile (niveau 0) au plus dur (niveau 3), avec une anecdote
const G = (name, words, fact) => ({name, words, fact});
// Difficulté d'une grille : facile, moyen, difficile ou goat
const D = (diff, groups) => Object.assign(groups, {diff});
// Les grilles sont chargées depuis grilles.json (voir loadGrids)
// URL des grilles : relative pour la PWA ; dans l'appli iOS (Capacitor), on va chercher la version en ligne.
const GRIDS_REMOTE="https://polishman444.github.io/Quatuor/grilles.json";
const GRIDS_URL=(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())?GRIDS_REMOTE:"grilles.json";
const GRIDS_LOCAL="grilles.json";   // copie de secours embarquée (mise en cache par le service worker)
let GRIDS=[];
let attempt=1, hasard=null;   // n° de l'essai en cours ; difficulté du mode « Grille au hasard » (null hors de ce mode)
// Grille d'entraînement du premier lancement (hors GRIDS : aucun impact sur stats, résultats ou favoris)
const TUTO = D("facile",[G("Animaux domestiques",["Chat","Chien","Lapin","Cheval"],"Le lapin n'est pas un rongeur : c'est un lagomorphe, comme le lièvre."),
  G("Pays",["France","Italie","Espagne","Japon"],"Le Japon compte plus de 14 000 îles !"),
  G("Fruits",["Pomme","Banane","Fraise","Poire"],"Pour un botaniste, la banane est une baie… mais pas la fraise !"),
  G("Couleurs",["Rouge","Bleu","Vert","Orange"],"En français, « orange » a d'abord désigné le fruit. La couleur a pris son nom bien plus tard.")]);
// Typographie française : espaces insécables avant : ; ! ? » et après « (pas de ponctuation seule en début de ligne)
const fr=t=>t.replace(/ ([:;!?»])/g,"\u00A0$1").replace(/« /g,"«\u00A0");
TUTO.forEach(g=>{ g.fact=fr(g.fact); g.name=fr(g.name); });
const LEVELS=["Facile","Réflexion","Coriace","Casse-tête"];
const ICON=["🌱","⚡","🔥","🧠"];
const $=id=>document.getElementById(id);
const ls={ get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} }, del:k=>{ try{ localStorage.removeItem(k); }catch(e){} } };
const start=new Date(2026,9,1), today=new Date(); today.setHours(0,0,0,0);
const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayStr=isoDay(today);   // date locale du joueur, ex. 2026-10-01
const dayNum=Math.floor((today-start)/864e5)+1;
const buzz=p=>{ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} };
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Difficulté des grilles : nombre d'erreurs autorisées et couleur
const DIFFS={facile:{name:"Facile",err:4,c:0},moyen:{name:"Moyen",err:4,c:1},difficile:{name:"Difficile",err:3,c:2},goat:{name:"GOAT",err:2,c:3,icon:"🐐"}};
const DKEYS=Object.keys(DIFFS);
// Une grille datée dans le futur reste cachée (pas de spoiler), sauf si elle est « toujours_visible »
const visible=i=>GRIDS[i].always||!GRIDS[i].jour||GRIDS[i].jour<=todayStr;
const idsOf=k=>GRIDS.map((_,i)=>i).filter(i=>GRIDS[i].diff===k&&visible(i));
const dname=k=>DIFFS[k].name+(DIFFS[k].icon?" "+DIFFS[k].icon:"");
// ---- Grille du jour : celle dont « jour » = date locale ; sinon une grille de secours, la même pour tous ----
let dailyIdx=-1;
const hashStr=s=>{ let h=2166136261; for(const c of s){ h^=c.codePointAt(0); h=Math.imul(h,16777619); } return h>>>0; };
function pickDaily(){
  const idx=GRIDS.map((_,i)=>i), notGoat=i=>GRIDS[i].diff!=="goat";
  const planned=idx.find(i=>GRIDS[i].jour===todayStr&&notGoat(i));
  if(planned!==undefined) return planned;
  // Secours : grilles non GOAT sans date ; à défaut, non GOAT déjà passées ; à défaut, n'importe laquelle
  let pool=idx.filter(i=>notGoat(i)&&!GRIDS[i].jour);
  if(!pool.length) pool=idx.filter(i=>notGoat(i)&&GRIDS[i].jour<todayStr);
  if(!pool.length) pool=idx.filter(notGoat);
  if(!pool.length) pool=idx;
  pool.sort((a,b)=>GRIDS[a].id<GRIDS[b].id?-1:1);      // indépendant de l'ordre du fichier
  return pool[hashStr(todayStr)%pool.length];
}

// ---- Lecture et validation de grilles.json ----
function checkGrid(x,ids){
  if(!x||typeof x.id!=="string"||!x.id) return "id manquant";
  if(ids.has(x.id)) return "id en double";
  if(!Number.isInteger(x.num)) return "num invalide";
  if(!DIFFS[x.difficulte]) return "difficulté inconnue";
  if(x.jour!=null&&!/^\d{4}-\d{2}-\d{2}$/.test(x.jour)) return "jour invalide";
  if(x.toujours_visible!=null&&typeof x.toujours_visible!=="boolean") return "toujours_visible doit valoir true ou false";
  if(!Array.isArray(x.groupes)||x.groupes.length!==4) return "il faut 4 groupes";
  for(const g of x.groupes)
    if(!g||typeof g.nom!=="string"||typeof g.anecdote!=="string"||!Array.isArray(g.mots)||g.mots.length!==4||g.mots.some(m=>typeof m!=="string"||!m.trim())) return "groupe invalide";
  if(new Set(x.groupes.flatMap(g=>g.mots)).size!==16) return "les 16 mots ne sont pas tous différents";
  return "";
}
function parseGrids(data){
  if(!data||!Array.isArray(data.grilles)) throw new Error("format inattendu");
  const out=[], ids=new Set();
  data.grilles.forEach((x,n)=>{
    const why=checkGrid(x,ids);
    if(why){ console.warn(`Quatuor : grille ${(x&&x.id)||"n°"+(n+1)} ignorée (${why})`); return; }
    ids.add(x.id);
    out.push(Object.assign(x.groupes.map(g=>G(fr(g.nom),g.mots.slice(),fr(g.anecdote))),{id:x.id,num:x.num,diff:x.difficulte,jour:x.jour||null,always:x.toujours_visible===true}));
  });
  return out;
}
function readGrids(text,src){
  try{ const g=parseGrids(JSON.parse(text)); if(g.length) return g; console.warn(`Quatuor : aucune grille valide (${src})`); }
  catch(e){ console.warn(`Quatuor : grilles illisibles (${src})`,e); }
  return null;
}
// Réseau d'abord (≈3 s max), puis copie locale, puis copie embarquée
async function loadGrids(){
  // Même arrivée après le délai, une réponse valide est gardée pour le prochain lancement
  const net=fetch(GRIDS_URL,{cache:"no-cache"}).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(t=>{ const g=readGrids(t,"réseau"); if(g) ls.set("quatuor-grilles",t); return g; });
  net.catch(()=>{});
  try{
    const g=await Promise.race([net,new Promise((_,ko)=>setTimeout(()=>ko(new Error("délai dépassé")),3000))]);
    if(g) return g;
  }catch(e){ console.warn("Quatuor : réseau indisponible ("+e.message+"), utilisation de la copie"); }
  const copy=ls.get("quatuor-grilles");
  if(copy){ const g=readGrids(copy,"copie locale"); if(g) return g; }
  try{
    let r=("caches" in window)?await caches.match(GRIDS_LOCAL,{ignoreSearch:true}):null;
    if(!r) r=await fetch(GRIDS_LOCAL);
    const g=readGrids(await r.text(),"copie embarquée"); if(g) return g;
  }catch(e){ console.warn("Quatuor : copie embarquée introuvable",e); }
  return null;
}

// ---- Migration unique : résultats et favoris passent de la position de la grille à son id ----
// Avant grilles.json, la grille en position i est devenue la grille d'id g001, g002… (même ordre).
function migrateData(){
  if(ls.get("quatuor-migr")==="1") return;
  const gid=i=>"g"+String(+i+1).padStart(3,"0");
  try{ const r=JSON.parse(ls.get("quatuor-res")||"{}"), n={};
    Object.keys(r).forEach(k=>{ n[/^\d+$/.test(k)?gid(k):k]=r[k]; });
    ls.set("quatuor-res",JSON.stringify(n)); }catch(e){ console.warn("Quatuor : migration des résultats impossible",e); }
  try{ const f=JSON.parse(ls.get("quatuor-favs")||"[]");
    if(Array.isArray(f)){ f.forEach(x=>{ if(typeof x.grid==="number"){ x.num=x.grid+1; x.grid=gid(x.grid); x.id=`${x.grid}:${x.name}`; } });
      ls.set("quatuor-favs",JSON.stringify(f)); } }catch(e){ console.warn("Quatuor : migration des favoris impossible",e); }
  ls.set("quatuor-migr","1");
}
function loadRes(){ try{ return JSON.parse(localStorage.getItem("quatuor-res"))||{}; }catch(e){ return {}; } }
function saveRes(r){ try{ localStorage.setItem("quatuor-res",JSON.stringify(r)); }catch(e){} }
let grid,gridIdx,practice,words,selected,found,mistakes,maxErr,history,tried,done,busy,gameId=0,menuTab=null,tuto=false,lastWin=false;

// ---- Animations (transform + opacity uniquement) ----
const RM=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const baseT=e=>e.classList.contains("tile")&&e.classList.contains("on")?"translateY(3px)":"";
// FLIP : mémorise les positions, applique le changement, puis fait glisser chaque élément depuis son ancienne place
function flipLayout(fn,o={}){
  if(RM()){ fn(); return; }
  const els=[...document.querySelectorAll("#tuto, #solved .solved, #grid .tile, #lives")];
  const before=new Map(els.map(e=>[e,e.getBoundingClientRect()]));
  fn();
  els.forEach(e=>{ if(e._fa){ e._fa.cancel(); e._fa=null; } });
  let k=0;
  before.forEach((r,e)=>{
    if(!e.isConnected) return;
    const n=e.getBoundingClientRect(), dx=r.left-n.left, dy=r.top-n.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1) return;
    const b=baseT(e), from=`translate(${dx}px,${dy}px) ${b}`, to=b||"none";
    const kf=o.lift?[{transform:from},{transform:`translate(${dx/2}px,${dy/2}px) ${b} scale(.97)`},{transform:to}]:[{transform:from},{transform:to}];
    e._fa=e.animate(kf,{duration:o.dur||450,delay:(o.stagger||0)*k++,easing:"cubic-bezier(.25,.8,.3,1)",fill:"backwards"});
    e._fa.onfinish=()=>{ e._fa=null; };
  });
}
function spring(t){
  if(RM()) return;
  t.classList.remove("spring"); void t.offsetWidth; t.classList.add("spring");
}
function burst(r,gi){
  if(RM()) return;
  for(let i=0;i<10;i++){
    const p=document.createElement("i"); p.className="spark"; p.style.background=`var(--l${gi})`;
    p.style.left=(r.left+r.width*(.1+.8*Math.random()))+"px"; p.style.top=(r.top+r.height/2)+"px";
    document.body.appendChild(p);
    const a=Math.random()*Math.PI*2, d=25+Math.random()*30, dx=Math.cos(a)*d, dy=Math.sin(a)*d*.7-12;
    p.animate([{transform:"scale(.9)",opacity:.9},{transform:`translate(${dx}px,${dy}px) scale(.3)`,opacity:0}],
      {duration:800+Math.random()*300,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>p.remove();
  }
}
function confetti(){
  if(RM()) return;
  const H=innerHeight+40;
  for(let i=0;i<50;i++){
    const c=document.createElement("i"); c.className="confetti"; c.style.background=`var(--l${i%4})`;
    c.style.left=(Math.random()*100)+"vw"; c.style.width=(7+Math.random()*5)+"px"; c.style.height=(10+Math.random()*7)+"px";
    document.body.appendChild(c);
    const dx=(Math.random()-.5)*120, rot=(Math.random()-.5)*540;
    c.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${dx}px,${H}px) rotate(${rot}deg)`,opacity:1,offset:.85},{transform:`translate(${dx}px,${H}px) rotate(${rot}deg)`,opacity:0}],
      {duration:1700+Math.random()*500,delay:Math.random()*400,easing:"cubic-bezier(.35,.25,.6,1)",fill:"backwards"}).onfinish=()=>c.remove();
  }
}
function loseDot(d){
  if(RM()) return;
  d.classList.remove("lose"); void d.offsetWidth; d.classList.add("lose");
  const r=d.getBoundingClientRect(), f=document.createElement("i"); f.className="fall";
  Object.assign(f.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});
  document.body.appendChild(f);
  f.animate([{transform:"none",opacity:.7},{transform:"translate(3px,26px) rotate(30deg) scale(.7)",opacity:0}],
    {duration:800,easing:"cubic-bezier(.45,0,.55,1)"}).onfinish=()=>f.remove();
}
const shuffleArr=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const groupOf=w=>grid.findIndex(g=>g.words.includes(w));

function newGame(idx,opts={}){
  tuto=idx===-1; gridIdx=idx; grid=tuto?TUTO:GRIDS[idx]; practice=tuto||idx!==dailyIdx; gameId++;
  hasard=opts.hasard||null;
  const prev=tuto?null:loadRes()[grid.id];
  // Grille perdue : pas de nouvelle partie sans passer par retenter() (et donc autoriserNouvelEssai)
  const lostView=!!(prev&&!prev.win&&opts.essai!==JETON_ESSAI);
  attempt=opts.essai===JETON_ESSAI&&prev?(prev.tries||1)+1:1;
  words=shuffleArr(grid.flatMap(g=>g.words)); selected=new Set(); found=[]; mistakes=0; history=[]; tried=new Set(); done=false; busy=false;
  maxErr=tuto?Infinity:DIFFS[grid.diff].err;   // tutoriel : erreurs illimitées
  $("lives").querySelector(".dots").innerHTML=tuto?"":"<i></i>".repeat(maxErr);
  const d=today.toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
  const badge=`<span class="dbadge l${DIFFS[grid.diff].c}">${dname(grid.diff)}</span>`;
  $("sub").classList.toggle("tsub",tuto);
  $("sub").innerHTML = tuto ? `<span>Grille d'<b>entraînement</b></span><button class="skip" id="skipTuto">Passer le tutoriel</button>`
    : (practice ? `Grille <b>n°${grid.num}</b>` : `Grille du jour · <b>${d}</b>`)+badge;
  if(tuto) $("skipTuto").onclick=endTuto;
  $("solved").innerHTML=""; $("lives").style.display=tuto?"none":"flex";
  const dk=document.querySelector(".dock"); dk.style.display="block"; dk.classList.remove("over","lost","pending");
  tutoMsg=""; $("tuto").hidden=!tuto||tutoHold; tutoUpdate();
  if(lostView){ if(prev.vu===false) showPendingBoard(prev); else showLostBoard(prev); return; }
  draw();
  updateNextLabels();
}
// Plateau révélé d'une grille perdue : les 4 bandeaux, « Voir mes résultats » et « Retenter »
function showLostBoard(prev){
  done=true; lastWin=false; words=[]; mistakes=prev.mistakes||maxErr; history=prev.hist||[]; attempt=prev.tries||1;
  $("grid").innerHTML=""; [0,1,2,3].forEach(gi=>addSolved(gi,false));
  $("lives").style.display="none";
  document.querySelector(".dock").classList.add("over","lost");
  updateNextLabels();
}
// Grille perdue dont la solution n'a pas été vue : groupes trouvés + tuiles restantes, solution cachée
function showPendingBoard(prev){
  done=true; lastWin=false; mistakes=prev.mistakes||maxErr; history=prev.hist||[]; attempt=prev.tries||1;
  found=Array.isArray(prev.found)?prev.found.slice()
    :[...new Set(history.filter(r=>r.every(x=>x===r[0])).map(r=>r[0]))];   // anciennes données : déduit de l'historique

function fit(tile){
  const span=tile.firstChild; if(!span) return;

  while(s>9.5&&over()){ s-=.5; tile.style.fontSize=s+"px"; }

  if(over()){ span.classList.add("hy"); s=14; tile.style.fontSize=s+"px"; while(s>8&&over()){ s-=.5; tile.style.fontSize=s+"px"; } }
}

// ---- Image d'une anecdote (canvas 1080×1080) ----
const SITE=(location.origin+location.pathname).replace(/index\.html$/,"").replace(/^https?:\/\//,"").replace(/\/$/,"");
function wrapText(x,text,maxW){
  const lines=[]; let line="";
  fr(text).split(/ +/).forEach(w=>{ const t=line?line+" "+w:w; if(line&&x.measureText(t).width>maxW){ lines.push(line); line=w; } else line=t; });
  if(line) lines.push(line); return lines;
}
async function factImage(f){
  try{ await Promise.all(["500","650","800"].map(w=>document.fonts.load(`${w} 40px "Bricolage Grotesque"`))); await document.fonts.ready; }catch(e){}
  const S=1080, c=document.createElement("canvas"); c.width=c.height=S; const x=c.getContext("2d");
  const FONT='"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif';
  const COL=["#45D0B0","#FFA552","#EF5B7C","#2E3A87"], TXT=["#082A22","#3A1E02","#FFFFFF","#FFFFFF"], INK="#1B2040", MUTED="#6B7190";
  const rr=(X,Y,W,H,R)=>{ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); };
  x.fillStyle="#EEF0F7"; x.fillRect(0,0,S,S); x.textBaseline="top";
  // Logo : les 4 carrés + « Quatuor »
  COL.forEach((col,i)=>{ x.fillStyle=col; rr(84+(i%2)*52,78+Math.floor(i/2)*52,44,44,12); x.fill(); });
  x.fillStyle=INK; x.font=`800 82px ${FONT}`; x.fillText("Quatuor",210,82);
  // Carte en relief avec la couleur du niveau à gauche
  const cx=80,cy=240,cw=920,ch=680, px=cx+74, maxW=cw-140;
  x.fillStyle="#CDD2E3"; rr(cx,cy+14,cw,ch,44); x.fill();
  x.fillStyle="#FFFFFF"; rr(cx,cy,cw,ch,44); x.fill();
  x.save(); rr(cx,cy,cw,ch,44); x.clip(); x.fillStyle=COL[f.lvl]; x.fillRect(cx,cy,24,ch); x.restore();
  // Pastille du niveau
  x.font=`650 34px ${FONT}`; const lbl=LEVELS[f.lvl], lw=x.measureText(lbl).width+56;
  x.fillStyle=COL[f.lvl]; rr(px,cy+58,lw,60,30); x.fill(); x.fillStyle=TXT[f.lvl]; x.fillText(lbl,px+28,cy+70);
  // Nom du groupe + mots
  let y=cy+150; x.fillStyle=INK; x.font=`800 58px ${FONT}`;
  wrapText(x,f.name,maxW).slice(0,2).forEach(l=>{ x.fillText(l,px,y); y+=66; });
  x.fillStyle=MUTED; x.font=`500 34px ${FONT}`;
  wrapText(x,f.words.join(" · "),maxW).slice(0,2).forEach(l=>{ x.fillText(l,px,y+6); y+=44; });
  y+=40;
  // Anecdote : la plus grande taille qui tient dans la carte
  const avail=cy+ch-56-y; let size=58, lines;
  for(;size>=30;size-=2){ x.font=`500 ${size}px ${FONT}`; lines=wrapText(x,f.fact,maxW); if(lines.length*size*1.28<=avail) break; }
  x.fillStyle=INK; lines.forEach(l=>{ x.fillText(l,px,y); y+=size*1.28; });
  // Adresse du site
  x.fillStyle=MUTED; x.font=`650 36px ${FONT}`; x.textAlign="center"; x.fillText(SITE,S/2,982);
  return c;
}
async function shareFav(f,btn){
  if(btn) btn.disabled=true;

    const file=new File([blob],"quatuor-anecdote.png",{type:"image/png"});

// Groupe trouvé : les tuiles sautent, volent vers le bandeau et fusionnent
function foundGroup(gi,tiles){
  const id=gameId, rm=RM();
  busy=true; updateUi(); buzz(30);
  tiles.forEach((t,i)=>{ if(t._fa){ t._fa.cancel(); t._fa=null; } t.classList.remove("spring","shake"); t.style.setProperty("--i",i); t.classList.add("jump"); });
  setTimeout(()=>{
    if(id!==gameId) return;
    const ghosts=rm?[]:tiles.map(t=>{
      const r=t.getBoundingClientRect(), g=t.cloneNode(true);
      g.className="tile ghost l"+gi; g.removeAttribute("id");
      Object.assign(g.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});
      document.body.appendChild(g); return {g,r};
    });
    let band;
    flipLayout(()=>{
      tiles.forEach(t=>t.remove());
      found.push(gi); words=words.filter(w=>!selected.has(w)); selected.clear();
      band=addSolved(gi,false,rm?"":"pre");
      busy=false; updateUi();
      if(found.length===4) finish(true); else tutoUpdate();
    });
    const openFact=()=>{ if(id===gameId&&band.isConnected) flipLayout(()=>setOpen(band,true)); };
    if(rm){ openFact(); return; }
    const br=band.getBoundingClientRect();
    ghosts.forEach(({g,r},i)=>{
      const tx=br.left+i*br.width/4-r.left, ty=br.top-r.top, sx=br.width/4/r.width, sy=br.height/r.height;
      const end=`translate(${tx}px,${ty}px) scale(${sx},${sy})`;
      g.animate([{transform:"none",easing:"cubic-bezier(.45,0,.25,1)"},{transform:end,opacity:1,offset:.8},{transform:end,opacity:0}],
        {duration:560,delay:i*40,fill:"both"}).onfinish=()=>g.remove();
    });
    setTimeout(()=>{
      if(id!==gameId) return;
      band.classList.remove("pre"); buzz(12);
      band.animate([{opacity:0,transform:"scale(.98)"},{opacity:1,transform:"scale(1.01)",offset:.55},{opacity:1,transform:"none"}],
        {duration:500,easing:"ease-out"});
      burst(band.getBoundingClientRect(),gi);
      setTimeout(openFact,400);
    },500);
  },rm?0:620);
}

function submit(){
  if(selected.size!==4||done||busy) return;
  const sel=[...selected], key=[...sel].sort().join("|");
  if(tried.has(key)){ toast("Déjà essayé"); return; }
  tried.add(key); history.push(sel.map(groupOf));
  const gi=groupOf(sel[0]), tiles=[...document.querySelectorAll(".tile.on")];
  if(sel.every(w=>groupOf(w)===gi)){
    foundGroup(gi,tiles);
  } else {
    mistakes++; buzz([40,40,40]);
    const c={}; sel.forEach(w=>c[groupOf(w)]=(c[groupOf(w)]||0)+1);
    if(Object.values(c).includes(3)) toast("Presque ! Un seul intrus",true);
    tiles.forEach(t=>{ t.classList.remove("shake","spring"); void t.offsetWidth; t.classList.add("shake"); });
    updateUi();
    if(mistakes>=maxErr){ busy=true; const id=gameId; setTimeout(()=>{ if(id===gameId) finish(false); },500); }
  }
}

function finish(win){
  done=true; selected.clear(); const id=gameId; lastWin=win;
  if(tuto){ // fin du tutoriel : pas de résultats ni de stats
    $("lives").style.display="none"; document.querySelector(".dock").style.display="none"; tutoUpdate();
    setTimeout(()=>{ if(id===gameId){ confetti(); buzz([20,40,20]); } },650); return; }
  $("grid").querySelectorAll(".tile.on").forEach(t=>{ t.classList.remove("on"); t.setAttribute("aria-pressed",false); });
  // Résultats enregistrés dès maintenant (même si l'appli est fermée juste après) :
  // premier essai, nombre d'essais, dernier plateau, groupes trouvés et « solution vue » (vu)
  const res=loadRes(), prev=res[grid.id];
  if(!prev) res[grid.id]={win,mistakes,tries:1,first:{win,mistakes},hist:history,found:found.slice(),vu:win};
  else if(attempt>1&&!prev.win){
    prev.first=prev.first||{win:prev.win,mistakes:prev.mistakes};
    prev.tries=attempt; prev.win=win; prev.mistakes=mistakes; prev.hist=history; prev.found=found.slice(); prev.vu=win;
  } // (une grille déjà réussie rejouée ne change rien)
  saveRes(res);
  if(!practice&&attempt===1){   // stats et série : seul le premier essai de la grille du jour compte
    const s=load();
    if(s.lastPlayed!==dayNum){
      s.played=(s.played||0)+1; s.lastPlayed=dayNum;
      if(win){ s.wins=(s.wins||0)+1; s.streak=(s.lastWin===dayNum-1?(s.streak||0):0)+1; s.lastWin=dayNum; s.best=Math.max(s.best||0,s.streak); }
      else s.streak=0;
      save(s);
    }
  }
  if(!win){ showPending(700); return; }   // défaite : la solution reste cachée, on propose de réessayer

function pickRandom(diff){
  const r=loadRes();
  // Grilles visibles uniquement (jamais une grille future cachée), hors grille du jour
  const pool=GRIDS.map((_,i)=>i).filter(i=>visible(i)&&i!==dailyIdx&&(diff==="toutes"||GRIDS[i].diff===diff));
  const fresh=pool.filter(i=>!r[GRIDS[i].id]);
  const any=a=>a[Math.floor(Math.random()*a.length)];
  if(fresh.length) return {i:any(fresh),again:false};
  const others=pool.filter(i=>i!==gridIdx);       // éviter celle qu'on vient de jouer
  const c=others.length?others:pool;
  return {i:c.length?any(c):undefined,again:true};
}
function launchRandom(diff,die){
  if(!GRIDS.length) return;
  const {i,again}=pickRandom(diff);
  if(i===undefined){ toast(diff==="toutes"?"Aucune grille disponible pour l'instant":`Pas encore de grille ${DIFFS[diff].name} disponible`); return; }
  buzz(10);
  const go=()=>{
    if(again) toast(diff==="toutes"?"Tu as déjà fait toutes les grilles ! En voici une à rejouer.":`Tu as déjà fait toutes les grilles ${DIFFS[diff].name} ! En voici une à rejouer.`);
    const x=loadRes()[GRIDS[i].id];
    if(x&&!x.win) retenter(i,{hasard:diff});      // grille perdue : nouvel essai, donc autorisation
    else { closeSheet(); setTimeout(()=>switchGame(i,{hasard:diff}),200); }
  };
  // Petit dé qui roule (< 0,6 s), puis la grille s'ouvre
  if(die&&!RM()) die.animate([{transform:"none"},{transform:"rotate(200deg) scale(1.25)",offset:.5},{transform:"rotate(360deg)"}],{duration:520,easing:"cubic-bezier(.3,.7,.4,1)"}).onfinish=go;
  else go();
}

// ---- Panneau du bas : le faire glisser vers le bas pour le fermer ----
(function(){
  const sh=$("sheet"), veil=$("veil");
  let y0=0, dy=0, h=0, active=false, dragging=false, grab=false, pts=[];
  const start=(y,target)=>{
    if(!sh.classList.contains("open")) return;
    grab=!!target.closest(".grab"); active=grab||sh.scrollTop<=0; dragging=false; dy=0; y0=y; h=sh.offsetHeight; pts=[[y,performance.now()]];
  };
  const move=(y,e)=>{
    const fixed=sh.scrollHeight<=sh.clientHeight+1;
    if(!active){ if(fixed&&e.cancelable) e.preventDefault(); return; }   // rien à faire défiler : on bloque la page derrière
    if(!dragging){
      const d=y-y0;
      if(d>6&&(grab||sh.scrollTop<=0)){ dragging=true; y0=y; sh.style.transition="none"; veil.style.transition="none"; }
      else if(d<-6&&!grab&&!fixed){ active=false; return; }               // défilement normal du contenu
      else { if((grab||fixed)&&e.cancelable) e.preventDefault(); return; }
    }
    if(e.cancelable) e.preventDefault();
    const raw=y-y0; dy=raw>0?raw:raw*.25;                                    // léger amorti vers le haut
    sh.style.transform=`translateY(${dy}px)`; veil.style.opacity=String(Math.max(0,1-Math.max(0,dy)/h));
    pts.push([y,performance.now()]); if(pts.length>6) pts.shift();
  };
  const end=()=>{
    if(!active) return; active=false; if(!dragging) return; dragging=false;
    const a=pts[0], b=pts[pts.length-1], v=(b[0]-a[0])/Math.max(1,b[1]-a[1]);  // px/ms
    sh.style.transition=""; veil.style.transition=""; sh.style.transform=""; veil.style.opacity="";
    if(dy>h/3||(v>.5&&dy>20)) closeSheet();
  };
  sh.addEventListener("touchstart",e=>start(e.touches[0].clientY,e.target),{passive:true});
  sh.addEventListener("touchmove",e=>move(e.touches[0].clientY,e),{passive:false});
  sh.addEventListener("touchend",end); sh.addEventListener("touchcancel",end);
  sh.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse") return; start(e.clientY,e.target);
    const mv=ev=>move(ev.clientY,ev), up=()=>{ end(); removeEventListener("pointermove",mv); removeEventListener("pointerup",up); };
    addEventListener("pointermove",mv); addEventListener("pointerup",up); });
  // Fond assombri : jamais de défilement de la page derrière
  veil.addEventListener("touchmove",e=>{ if(e.cancelable) e.preventDefault(); },{passive:false});
  // Un geste de glisser ne doit pas déclencher un bouton du panneau
  sh.addEventListener("click",e=>{ if(Math.abs(dy)>6){ e.stopPropagation(); e.preventDefault(); dy=0; } },true);
})();

const firstRun=!ls.get("quatuor-tuto-done");
const showWelcome=!ls.get("quatuor-hide-welcome");
if(firstRun){ ls.set("quatuor-tuto-done","1"); tutoHold=showWelcome; newGame(-1); } else showSkeleton();
boot();
if(showWelcome) setTimeout(()=>openWelcome(releaseTuto),300);
if("serviceWorker" in navigator){ addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{})); }
</script>
