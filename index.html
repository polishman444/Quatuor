<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EEF0F7">
<title>Quatuor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quatuor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- Police hébergée localement (RGPD : aucun appel à un service tiers) -->
<link rel="preload" href="fonts/BricolageGrotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/bricolage.css">
<script>
// Réglages d'apparence appliqués avant l'affichage (thème, taille du texte, mode daltonien)
try{ const r=JSON.parse(localStorage.getItem("quatuor-reglages")||"null"), h=document.documentElement;
  if(r&&(r.theme==="light"||r.theme==="dark")) h.dataset.theme=r.theme;
  if(r&&r.texte==="grand") h.classList.add("grand"); if(r&&r.daltonien) h.classList.add("dalto"); }catch(e){}
</script>
<link rel="stylesheet" href="css/quatuor.css">
</head>
<body data-view="jeu">
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1>Quatuor</h1></div>
    <div class="icons">
      <button class="ibtn" id="setBtn" aria-label="Paramètres"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>
  <div class="modes" id="modes" role="tablist"><button data-m="jour" role="tab" class="on"><span class="lg">Grille du jour</span><span class="sm">Du jour</span></button><button data-m="bonus" role="tab">Bonus</button><button data-m="hasard" role="tab">Hasard 🎲</button></div>
  <div class="sub" id="sub"></div>
  <div class="area">
    <div class="hintbar" id="hintBar" hidden></div>
    <div class="stack">
      <div class="stack" id="solved"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="lives" id="lives">Erreurs restantes <span class="dots"></span></div>
  </div>
  <section class="themes" id="themesView" hidden aria-label="Thèmes"></section>
  <section class="page" id="pageView" hidden></section>
</div>

<nav class="dock"><div class="dock-in">
  <button class="round play" id="shuffle" aria-label="Mélanger"><svg viewBox="0 0 24 24"><path d="M4 7h3.5c4 0 5 10 9 10H20M4 17h3.5c1.6 0 2.7-1.6 3.6-3.5M20 7h-3.5c-1.6 0-2.7 1.6-3.6 3.5M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5"/></svg></button>
  <button class="round play hintb" id="hintBtn" aria-label="Indice"><span aria-hidden="true">💡</span><b class="hcount">2</b></button>
  <button class="pill soft play" id="clear" disabled>Effacer</button>
  <button class="pill main play" id="submit" disabled>Valider</button>
  <button class="pill main pend" id="retryP">Réessayer 🔄</button>
  <button class="pill soft pend" id="revealP">Voir la solution</button>
  <button class="round end lostonly" id="retryD" aria-label="Retenter"><span style="font-size:1.35rem">🔄</span></button>
  <button class="pill main end" id="seeRes"><span class="lg">Voir mes résultats</span><span class="sm">Résultats</span></button>
  <button class="pill soft end" id="nextG"><span class="lg">Grille suivante</span><span class="sm">Suivante</span></button>
</div><div class="homebox" id="homeBox" role="region" aria-label="Grille du jour terminée"></div></nav>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<nav class="tabs" id="tabs" aria-label="Navigation"><div class="tabs-in">
  <button data-tab="jouer" class="on" aria-current="page"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Jouer</button>
  <button data-tab="themes"><svg viewBox="0 0 24 24"><path d="M3 7.5a2 2 0 0 1 2-2h4.2l2 2.2H19a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Thèmes</button>
  <button data-tab="progres"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Progrès</button>
  <button data-tab="moi"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>Moi</button>
</div></nav>
<div class="toast" id="toast"></div>
<div id="spot" hidden><div class="spot-trou"></div><div class="spot-b"></div><div class="spot-b"></div><div class="spot-b"></div><div class="spot-b"></div>
  <div class="bulle" role="dialog" aria-live="polite"><p></p><div class="bulle-act"></div><i class="fl" aria-hidden="true"></i></div></div>

<!-- Mode en ligne : configuration publique, calculs purs, synchronisation (le jeu fonctionne sans) -->
<script src="config-en-ligne.js"></script>
<script src="js/calculs.js"></script>
<script src="js/pseudos.js"></script>
<script src="js/telemetrie.js"></script>
<script src="js/en-ligne.js"></script>
<script src="js/grilles.js"></script>
<script src="js/jeu.js"></script>
</body>
</html>
