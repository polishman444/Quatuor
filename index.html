<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EEF0F7">
<title>Quatuor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quatuor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F7; --card:#FFFFFF; --edge:#CDD2E3; --ink:#1B2040; --muted:#6B7190; --sel:#1B2040; --sel-ink:#FFFFFF; --sheet:#FFFFFF;
  /* 4 niveaux : Facile, Réflexion, Coriace, Casse-tête */
  --l0:#45D0B0; --l0e:#27A085; --l1:#FFA552; --l1e:#D27B26; --l2:#EF5B7C; --l2e:#BF3A59; --l3:#2E3A87; --l3e:#18204F;
  --font:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#12152A; --card:#252A48; --edge:#0A0C1B; --ink:#F1F2FA; --muted:#9AA0C0; --sel:#F1F2FA; --sel-ink:#12152A; --sheet:#1C2039; --l3:#4A58C2; --l3e:#2A347F; }
}
:root[data-theme="dark"]{ --bg:#12152A; --card:#252A48; --edge:#0A0C1B; --ink:#F1F2FA; --muted:#9AA0C0; --sel:#F1F2FA; --sel-ink:#12152A; --sheet:#1C2039; --l3:#4A58C2; --l3e:#2A347F; }
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
/* Pas de zoom au double-tap (iPhone) */
html,body,button{touch-action:manipulation}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:10px 16px 110px;min-height:100svh;display:flex;flex-direction:column}
.area{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:10px}

.top{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{display:flex;align-items:center;gap:8px}
.brand .ibtn{margin-left:-8px}
.mark{display:grid;grid-template-columns:repeat(2,11px);gap:3px}
.mark i{width:11px;height:11px;border-radius:3px;display:block}
.mark i:nth-child(1){background:var(--l0)} .mark i:nth-child(2){background:var(--l1)}
.mark i:nth-child(3){background:var(--l2)} .mark i:nth-child(4){background:var(--l3)}
h1{margin:0;font-size:1.65rem;font-weight:800;letter-spacing:-.03em}
.icons{display:flex;gap:6px}
.ibtn{width:42px;height:42px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{background:var(--edge)}
.sub{margin:4px 2px 14px;color:var(--muted);font-weight:500}
.sub b{color:var(--ink);font-weight:650}

.stack{display:grid;gap:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{position:relative;border:0;border-radius:14px;background:var(--card);box-shadow:0 4px 0 var(--edge);aspect-ratio:1/1;padding:4px;cursor:pointer;
  display:grid;place-items:center;text-align:center;font-weight:650;line-height:1.08;word-break:keep-all;overflow:hidden;
  transition:transform .12s ease, box-shadow .12s ease, background .12s, color .12s}
.tile span{display:block;max-width:100%}
.tile span.hy{-webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere}
.tile.on{background:var(--sel);color:var(--sel-ink);transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
/* Effet ressort à la sélection : la tuile s'enfonce puis rebondit */
.tile.spring{animation:sprOff .45s cubic-bezier(.25,.8,.35,1) both}
.tile.on.spring{animation:sprOn .45s cubic-bezier(.25,.8,.35,1) both}
@keyframes sprOn{0%{transform:none}40%{transform:translateY(4px) scale(.96)}100%{transform:translateY(3px)}}
@keyframes sprOff{0%{transform:translateY(3px)}40%{transform:translateY(1px) scale(1.015)}100%{transform:none}}
.tile.jump{animation:jump .42s ease-in-out both;animation-delay:calc(var(--i)*70ms)}
.tile.shake{animation:shake .5s ease-in-out}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#E5484D;opacity:0;pointer-events:none}
.tile.shake::after{animation:flash .6s ease-out}
@keyframes jump{0%,100%{transform:translateY(3px)}50%{transform:translateY(-8px) scale(1.02)}}
@keyframes shake{0%,100%{transform:translate(0,3px)}20%{transform:translate(-4px,3px)}40%{transform:translate(4px,3px)}60%{transform:translate(-2.5px,3px)}80%{transform:translate(2px,3px)}}
@keyframes flash{0%{opacity:0}20%{opacity:.3}100%{opacity:0}}
/* Tuiles qui volent vers le bandeau, particules, confettis */
.ghost{position:fixed;margin:0;z-index:15;pointer-events:none;transition:none;animation:none;transform-origin:0 0}
.spark,.confetti,.fall{position:fixed;display:block;pointer-events:none;z-index:25}
.spark{width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:3px}
.confetti{top:-18px;border-radius:2px}
.fall{border-radius:4px;background:var(--ink);z-index:5}

/* Groupe trouvé + anecdote */
.solved{border:0;width:100%;border-radius:14px;padding:12px 14px 11px;text-align:center;cursor:pointer;display:block;font:inherit}
.solved.pop{animation:land .5s cubic-bezier(.25,.8,.35,1) both}
.solved.pre{opacity:0}
.solved .lvl{font-size:.78rem;font-weight:650;opacity:.8}
.solved strong{display:block;font-size:1.02rem;font-weight:800;letter-spacing:-.01em;margin-top:1px}
.solved .w{display:block;font-size:.92rem;font-weight:500;margin-top:2px}
.fact{display:grid;grid-template-rows:0fr}
.fact>div{overflow:hidden}
.fact p{margin:10px 0 2px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.28);font-size:.92rem;font-weight:500;line-height:1.35;text-align:left}
.solved.open .fact{grid-template-rows:1fr}
.solved.open .fact p{animation:factIn .6s cubic-bezier(.25,.8,.35,1) both}
@keyframes factIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.solved .more{display:block;font-size:.78rem;font-weight:650;margin-top:5px;opacity:.75}
.solved.open .more{display:none}
.l0{background:var(--l0);box-shadow:0 4px 0 var(--l0e);color:#082A22}
.l1{background:var(--l1);box-shadow:0 4px 0 var(--l1e);color:#3A1E02}
.l2{background:var(--l2);box-shadow:0 4px 0 var(--l2e);color:#fff}
.l3{background:var(--l3);box-shadow:0 4px 0 var(--l3e);color:#fff}
@keyframes land{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}

.lives{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0 0;color:var(--muted);font-size:.95rem;font-weight:500}
.lives .dots{display:flex;gap:6px}
.lives i{width:14px;height:14px;border-radius:4px;background:var(--ink);display:block;transition:transform .25s, opacity .25s}
.lives i.off{opacity:.15;transform:scale(.7)}
.lives i.lose{animation:deflate .7s ease-in-out both}
@keyframes deflate{0%{transform:none;opacity:1}30%{transform:scale(1.12)}100%{transform:scale(.7);opacity:.15}}
.round.spin svg{animation:spin .6s cubic-bezier(.25,.8,.35,1)}
@keyframes spin{from{transform:rotate(-180deg)}to{transform:none}}

.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top, var(--bg) 70%, transparent)}
.dock-in{max-width:480px;margin:0 auto;display:flex;gap:10px;align-items:center}
.round{flex:none;width:54px;height:54px;border-radius:50%;border:0;background:var(--card);box-shadow:0 4px 0 var(--edge);display:grid;place-items:center;cursor:pointer}
.round svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{flex:1;height:54px;border-radius:27px;border:0;font-size:1.08rem;font-weight:800;cursor:pointer;transition:transform .1s, box-shadow .1s, opacity .15s}
.pill.main{background:var(--ink);color:var(--bg);box-shadow:0 4px 0 #000}
.pill.soft{background:var(--card);box-shadow:0 4px 0 var(--edge)}
.round:active,.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.pill:disabled,.round:disabled{opacity:.35;cursor:default;transform:none}
button:focus-visible{outline:3px solid var(--l2);outline-offset:3px}

.veil{position:fixed;inset:0;background:rgba(10,12,28,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.veil.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);border-radius:24px 24px 0 0;
  padding:10px 22px calc(24px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;transform:translateY(105%);
  transition:transform .35s cubic-bezier(.4,0,.6,1);max-height:88vh;overflow:auto;box-shadow:0 60px 0 var(--sheet)}
.sheet.open{transform:translateY(0);transition:transform .55s cubic-bezier(.22,1.08,.4,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--edge);margin:0 auto 14px}
.sheet h2{margin:0 0 6px;font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.sheet h3{margin:18px 0 8px;font-size:1.1rem;font-weight:800}
.sheet p{margin:0 0 10px;color:var(--muted)}
.sheet p.lead{color:var(--ink);font-size:1.05rem;margin:4px 0 12px}
.rule{display:flex;gap:12px;align-items:center;margin:10px 0}
.rule .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--bg);color:var(--ink)}
/* Légende des couleurs : purement informative, rien de cliquable */
.legend{margin:18px 0 20px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--edge)}
.legend .t{display:block;font-size:.85rem;font-weight:650;color:var(--muted);margin-bottom:8px}
.legend .sw{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:.8rem;font-weight:650}
.legend .sw i{display:block;width:18px;height:18px;border-radius:5px;margin:0 auto 4px;box-shadow:none}
.legend .ax{display:flex;justify-content:space-between;margin-top:6px;font-size:.75rem;color:var(--muted)}
.recap{display:grid;gap:4px;justify-content:center;margin:14px 0 16px}
.recap div{display:flex;gap:4px}
.recap i{width:26px;height:26px;border-radius:7px;display:block;animation:sq .45s cubic-bezier(.25,1.2,.4,1) both;animation-delay:calc(.4s + var(--k)*50ms)}
@keyframes sq{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.learned{display:grid;gap:8px;margin-bottom:18px}
.learned div{border-left:5px solid;padding:6px 0 6px 12px;font-size:.93rem;line-height:1.35}
.learned b{display:block;font-size:.85rem}
.learned .b0{border-color:var(--l0)} .learned .b1{border-color:var(--l1)} .learned .b2{border-color:var(--l2)} .learned .b3{border-color:var(--l3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 20px;text-align:center}
.stats b{display:block;font-size:1.7rem;font-weight:800;line-height:1.1}
.stats small{color:var(--muted);font-size:.8rem}
.row{display:flex;gap:10px}

/* Tiroir des grilles */
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:21;width:min(86vw,360px);background:var(--sheet);
  padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateX(-102%);transition:transform .32s cubic-bezier(.4,0,.6,1);overflow:auto;border-radius:0 22px 22px 0;box-shadow:-60px 0 0 var(--sheet)}
.drawer.open{transform:translateX(0);transition:transform .5s cubic-bezier(.22,1.06,.4,1)}
.drawer h2{margin:0 0 -4px;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.prog{margin:4px 0 14px;color:var(--muted);font-weight:500}
.prog b{color:var(--ink)}
.drawer .sec{margin:16px 0 8px;font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.dtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.dtab{border:0;border-radius:12px;padding:8px 2px 7px;background:var(--bg);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .2s}
.dtab i{width:12px;height:12px;border-radius:4px;box-shadow:none;display:block}
.dtab b{font-size:.8rem;font-weight:700;white-space:nowrap}
.dtab small{font-size:.72rem;color:var(--muted)}
.dtab.on{background:var(--ink);color:var(--bg)}
.dtab.on small{color:var(--bg);opacity:.7}
.dtab:active{transform:scale(.96)}
.dbadge{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;box-shadow:none;vertical-align:1px}
.bar{height:8px;border-radius:4px;background:var(--edge);overflow:hidden;margin:-6px 0 16px}
.bar i{display:block;height:100%;background:var(--l0);border-radius:4px}
.glist{display:grid;gap:8px}
.gitem{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--bg);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit}
.gitem.cur{outline:2.5px solid var(--ink)}
.gitem .num{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--card);box-shadow:0 3px 0 var(--edge)}
.gitem.win .num{background:var(--l0);color:#082A22;box-shadow:0 3px 0 var(--l0e)}
.gitem.lost .num{background:var(--l2);color:#fff;box-shadow:0 3px 0 var(--l2e)}
.gitem .txt{flex:1;min-width:0}
.gitem b{display:block;font-weight:700}
.gitem small{color:var(--muted);font-size:.85rem}
.tag{flex:none;font-size:.75rem;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:12px;font-weight:650;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;transition-duration:1ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><button class="ibtn" id="menuBtn" aria-label="Toutes les grilles"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1>Quatuor</h1></div>
    <div class="icons">
      <button class="ibtn" id="helpBtn" aria-label="Règles du jeu"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 1c0 1.8-2.5 2.2-2.5 3.8"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></svg></button>
      <button class="ibtn" id="statsBtn" aria-label="Statistiques"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg></button>
    </div>
  </header>
  <div class="sub" id="sub"></div>
  <div class="area">
    <div class="stack">
      <div class="stack" id="solved"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="lives" id="lives">Erreurs restantes <span class="dots"></span></div>
  </div>
</div>

<nav class="dock"><div class="dock-in">
  <button class="round" id="shuffle" aria-label="Mélanger"><svg viewBox="0 0 24 24"><path d="M4 7h3.5c4 0 5 10 9 10H20M4 17h3.5c1.6 0 2.7-1.6 3.6-3.5M20 7h-3.5c-1.6 0-2.7 1.6-3.6 3.5M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5"/></svg></button>
  <button class="pill soft" id="clear" disabled>Effacer</button>
  <button class="pill main" id="submit" disabled>Valider</button>
</div></nav>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<nav class="drawer" id="drawer" aria-label="Toutes les grilles"></nav>
<div class="toast" id="toast"></div>

<script>
// Chaque grille : 4 groupes du plus facile (niveau 0) au plus dur (niveau 3), avec une anecdote
const G = (name, words, fact) => ({name, words, fact});
// Difficulté d'une grille : facile, moyen, difficile ou goat
const D = (diff, groups) => Object.assign(groups, {diff});
const GRIDS = [
 D("moyen",[G("Planètes du système solaire",["Mercure","Saturne","Uranus","Neptune"],"Neptune a été découverte par le calcul avant d'être observée : en 1846, le Français Urbain Le Verrier a prédit sa position à partir des perturbations de l'orbite d'Uranus."),
  G("Gares parisiennes",["Austerlitz","Montparnasse","Saint-Lazare","Bercy"],"Claude Monet a peint en 1877 toute une série de tableaux de la gare Saint-Lazare, fasciné par la vapeur des locomotives."),
  G("Films d'Alfred Hitchcock",["Psychose","Vertigo","Les Oiseaux","Rebecca"],"« Vertigo » est sorti en France sous le titre « Sueurs froides »."),
  G("Batailles de Napoléon",["Iéna","Wagram","Marengo","Eylau"],"Paris est remplie de noms de victoires napoléoniennes : pont d'Iéna, avenue de Wagram, avenue d'Eylau… et gare d'Austerlitz, d'où le piège !")]),
 D("moyen",[G("Fleuves français",["Loire","Seine","Garonne","Rhône"],"La Loire est le plus long fleuve de France, avec environ 1 000 km."),
  G("Personnages de Molière",["Harpagon","Tartuffe","Alceste","Scapin"],"« Tartuffe » a été interdit pendant cinq ans après sa première représentation en 1664, sous la pression des milieux religieux."),
  G("Mots venus de l'arabe",["Algèbre","Café","Sucre","Zéro"],"« Zéro » et « chiffre » viennent du même mot arabe, ṣifr, qui signifie « vide »."),
  G("Éléments nommés d'après un pays",["Francium","Germanium","Polonium","Gallium"],"Le gallium a été découvert en 1875 par le Français Lecoq de Boisbaudran, qui l'a nommé d'après la Gaule, Gallia en latin.")]),
 D("facile",[G("Dieux grecs",["Zeus","Apollon","Poséidon","Athéna"],"Selon le mythe, Athéna serait née adulte et tout armée, jaillissant du crâne de Zeus."),
  G("Maisons de luxe françaises",["Chanel","Dior","Cartier","Hermès"],"Hermès a été fondé en 1837 comme atelier de harnais et de selles pour chevaux."),
  G("Peintres impressionnistes",["Monet","Degas","Renoir","Pissarro"],"Le mot « impressionnisme » est né d'une moquerie : un critique s'est inspiré du tableau de Monet « Impression, soleil levant » pour se moquer du groupe."),
  G("Unités nommées d'après un savant",["Newton","Watt","Ampère","Pascal"],"À 19 ans, Blaise Pascal a inventé l'une des premières machines à calculer, la Pascaline.")]),
 D("facile",[G("Pâtes italiennes",["Penne","Farfalle","Linguine","Fusilli"],"« Farfalle » signifie « papillons » en italien."),
  G("Capitales africaines",["Dakar","Nairobi","Accra","Bamako"],"Dakar se trouve sur la presqu'île du Cap-Vert, qui abrite le point le plus à l'ouest de l'Afrique continentale."),
  G("Mathématiciens français",["Fermat","Descartes","Galois","Laplace"],"Évariste Galois a posé les bases d'une théorie majeure des mathématiques avant de mourir en duel, à 20 ans, en 1832."),
  G("Mots français utilisés en anglais",["Rendez-vous","Déjà-vu","Cliché","Entrepreneur"],"L'expression « déjà vu » a été popularisée par le chercheur français Émile Boirac à la fin du XIXe siècle.")]),

// FLIP : mémorise les positions, applique le changement, puis fait glisser chaque élément depuis son ancienne place
function flipLayout(fn,o={}){
  if(RM()){ fn(); return; }
  const els=[...document.querySelectorAll("#solved .solved, #grid .tile, #lives")];
  const before=new Map(els.map(e=>[e,e.getBoundingClientRect()]));
  fn();
  els.forEach(e=>{ if(e._fa){ e._fa.cancel(); e._fa=null; } });
  let k=0;
  before.forEach((r,e)=>{
    if(!e.isConnected) return;
    const n=e.getBoundingClientRect(), dx=r.left-n.left, dy=r.top-n.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1) return;
    const b=baseT(e), from=`translate(${dx}px,${dy}px) ${b}`, to=b||"none";
    const kf=o.lift?[{transform:from},{transform:`translate(${dx/2}px,${dy/2}px) ${b} scale(.97)`},{transform:to}]:[{transform:from},{transform:to}];
    e._fa=e.animate(kf,{duration:o.dur||450,delay:(o.stagger||0)*k++,easing:"cubic-bezier(.25,.8,.3,1)",fill:"backwards"});
    e._fa.onfinish=()=>{ e._fa=null; };
  });
}
function spring(t){
  if(RM()) return;
  t.classList.remove("spring"); void t.offsetWidth; t.classList.add("spring");
}
function burst(r,gi){
  if(RM()) return;
  for(let i=0;i<10;i++){
    const p=document.createElement("i"); p.className="spark"; p.style.background=`var(--l${gi})`;
    p.style.left=(r.left+r.width*(.1+.8*Math.random()))+"px"; p.style.top=(r.top+r.height/2)+"px";
    document.body.appendChild(p);
    const a=Math.random()*Math.PI*2, d=25+Math.random()*30, dx=Math.cos(a)*d, dy=Math.sin(a)*d*.7-12;
    p.animate([{transform:"scale(.9)",opacity:.9},{transform:`translate(${dx}px,${dy}px) scale(.3)`,opacity:0}],
      {duration:800+Math.random()*300,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>p.remove();
  }
}
function confetti(){
  if(RM()) return;
  const H=innerHeight+40;
  for(let i=0;i<50;i++){
    const c=document.createElement("i"); c.className="confetti"; c.style.background=`var(--l${i%4})`;
    c.style.left=(Math.random()*100)+"vw"; c.style.width=(7+Math.random()*5)+"px"; c.style.height=(10+Math.random()*7)+"px";
    document.body.appendChild(c);
    const dx=(Math.random()-.5)*120, rot=(Math.random()-.5)*540;
    c.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${dx}px,${H}px) rotate(${rot}deg)`,opacity:1,offset:.85},{transform:`translate(${dx}px,${H}px) rotate(${rot}deg)`,opacity:0}],
      {duration:1700+Math.random()*500,delay:Math.random()*400,easing:"cubic-bezier(.35,.25,.6,1)",fill:"backwards"}).onfinish=()=>c.remove();
  }
}
function loseDot(d){
  if(RM()) return;
  d.classList.remove("lose"); void d.offsetWidth; d.classList.add("lose");
  const r=d.getBoundingClientRect(), f=document.createElement("i"); f.className="fall";
  Object.assign(f.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});
  document.body.appendChild(f);
  f.animate([{transform:"none",opacity:.7},{transform:"translate(3px,26px) rotate(30deg) scale(.7)",opacity:0}],
    {duration:800,easing:"cubic-bezier(.45,0,.55,1)"}).onfinish=()=>f.remove();
}
const shuffleArr=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const groupOf=w=>grid.findIndex(g=>g.words.includes(w));

function newGame(idx){
  gridIdx=idx; grid=GRIDS[idx]; practice=idx!==dailyIdx; gameId++;
  words=shuffleArr(grid.flatMap(g=>g.words)); selected=new Set(); found=[]; mistakes=0; history=[]; tried=new Set(); done=false; busy=false;
  maxErr=DIFFS[grid.diff].err;
  $("lives").querySelector(".dots").innerHTML="<i></i>".repeat(maxErr);
  const d=today.toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
  const badge=`<span class="dbadge l${DIFFS[grid.diff].c}">${dname(grid.diff)}</span>`;
  $("sub").innerHTML = (practice ? `Grille <b>n°${idx+1}</b>` : `Grille du jour · <b>${d}</b>`)+badge;
  $("solved").innerHTML=""; $("lives").style.display="flex"; document.querySelector(".dock").style.display="block";
  draw();
}
// Passage à une autre grille : l'ancienne glisse vers la gauche, la nouvelle arrive par la droite
function switchGame(idx){
  const parts=[$("sub"),document.querySelector(".area")];
  if(RM()){ scrollTo(0,0); newGame(idx); return; }
  busy=true; scrollTo({top:0,behavior:"smooth"});
  const outs=parts.map(e=>e.animate([{transform:"none",opacity:1},{transform:"translateX(-28px)",opacity:0}],{duration:260,easing:"cubic-bezier(.4,0,1,1)",fill:"forwards"}));
  outs[1].onfinish=()=>{
    newGame(idx);
    parts.forEach((e,i)=>e.animate([{transform:"translateX(28px)",opacity:0},{transform:"none",opacity:1}],{duration:420,delay:i*40,easing:"cubic-bezier(.2,.8,.3,1)",fill:"backwards"}));
    outs.forEach(a=>a.cancel());
    [...$("grid").children].forEach((t,i)=>t.animate([{transform:"translateY(10px) scale(.96)",opacity:0},{transform:"none",opacity:1}],
      {duration:420,delay:80+i*22,easing:"cubic-bezier(.2,.8,.3,1)",fill:"backwards"}));
    const dk=document.querySelector(".dock"); dk.animate([{opacity:0},{opacity:1}],{duration:400,easing:"ease-out"});
  };
}
function fit(tile){
  const span=tile.firstChild, over=()=>span.scrollWidth>tile.clientWidth-6||span.scrollHeight>tile.clientHeight-6;
  let s=17; span.classList.remove("hy"); tile.style.fontSize=s+"px";
  while(s>9.5&&over()){ s-=.5; tile.style.fontSize=s+"px"; }
  // Mot très long sur petit écran : on le coupe en deux lignes plutôt que de le rendre illisible
  if(over()){ span.classList.add("hy"); s=14; tile.style.fontSize=s+"px"; while(s>8&&over()){ s-=.5; tile.style.fontSize=s+"px"; } }
}
function draw(){
  const g=$("grid"); g.innerHTML="";
  words.forEach(w=>{
    const b=document.createElement("button");
    b.className="tile"+(selected.has(w)?" on":""); b.innerHTML="<span></span>"; b.firstChild.textContent=w;
    b.setAttribute("aria-pressed",selected.has(w)); b.dataset.w=w; b.onclick=()=>toggle(w,b);
    b.addEventListener("animationend",e=>{ if(e.animationName.startsWith("spr")) b.classList.remove("spring"); else if(e.animationName==="shake") b.classList.remove("shake"); });
    g.appendChild(b);
  });
  requestAnimationFrame(()=>g.querySelectorAll(".tile").forEach(fit));
  updateUi();
}
function updateUi(){
  [...$("lives").querySelectorAll("i")].forEach((d,i)=>{
    const off=i>=maxErr-mistakes;
    if(off&&!d.classList.contains("off")) loseDot(d);
    if(!off) d.classList.remove("lose");
    d.classList.toggle("off",off);
  });
  $("submit").disabled=selected.size!==4||done||busy;
  $("clear").disabled=selected.size===0||done||busy;
}
function toggle(w,b){
  if(done||busy) return;
  if(selected.has(w)) selected.delete(w); else { if(selected.size>=4){ buzz(15); return; } selected.add(w); }
  buzz(8); b.classList.toggle("on",selected.has(w)); b.setAttribute("aria-pressed",selected.has(w)); spring(b); updateUi();
}

function setOpen(d,o){
  if(o) $("solved").querySelectorAll(".solved.open").forEach(x=>{ if(x!==d){ x.classList.remove("open"); x.setAttribute("aria-expanded",false); } });
  d.classList.toggle("open",o); d.setAttribute("aria-expanded",o);
}
function addSolved(gi,open,cls){
  const g=grid[gi], d=document.createElement("button");
  d.className="solved l"+gi+(cls?" "+cls:""); d.setAttribute("aria-expanded",false);
  d.innerHTML=`<span class="lvl">${ICON[gi]} ${LEVELS[gi]}</span><strong>${esc(g.name)}</strong><span class="w">${esc(g.words.join(", "))}</span>
    <span class="more">💡 Voir l'anecdote</span><div class="fact"><div><p>💡 ${esc(g.fact)}</p></div></div>`;
  d.onclick=()=>flipLayout(()=>setOpen(d,!d.classList.contains("open")));
  d.addEventListener("animationend",e=>{ if(e.animationName==="land") d.classList.remove("pop"); });
  $("solved").appendChild(d);
  if(open) setOpen(d,true);
  return d;
}

// Groupe trouvé : les tuiles sautent, volent vers le bandeau et fusionnent
function foundGroup(gi,tiles){
  const id=gameId, rm=RM();
  busy=true; updateUi(); buzz(30);
  tiles.forEach((t,i)=>{ if(t._fa){ t._fa.cancel(); t._fa=null; } t.classList.remove("spring","shake"); t.style.setProperty("--i",i); t.classList.add("jump"); });
  setTimeout(()=>{
    if(id!==gameId) return;
    const ghosts=rm?[]:tiles.map(t=>{
      const r=t.getBoundingClientRect(), g=t.cloneNode(true);
      g.className="tile ghost l"+gi; g.removeAttribute("id");
      Object.assign(g.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});
      document.body.appendChild(g); return {g,r};
    });
    let band;
    flipLayout(()=>{
      tiles.forEach(t=>t.remove());
      found.push(gi); words=words.filter(w=>!selected.has(w)); selected.clear();
      band=addSolved(gi,false,rm?"":"pre");
      busy=false; updateUi();
      if(found.length===4) finish(true);
    });
    const openFact=()=>{ if(id===gameId&&band.isConnected) flipLayout(()=>setOpen(band,true)); };
    if(rm){ openFact(); return; }
    const br=band.getBoundingClientRect();
    ghosts.forEach(({g,r},i)=>{
      const tx=br.left+i*br.width/4-r.left, ty=br.top-r.top, sx=br.width/4/r.width, sy=br.height/r.height;
      const end=`translate(${tx}px,${ty}px) scale(${sx},${sy})`;
      g.animate([{transform:"none",easing:"cubic-bezier(.45,0,.25,1)"},{transform:end,opacity:1,offset:.8},{transform:end,opacity:0}],
        {duration:560,delay:i*40,fill:"both"}).onfinish=()=>g.remove();
    });
    setTimeout(()=>{
      if(id!==gameId) return;
      band.classList.remove("pre"); buzz(12);
      band.animate([{opacity:0,transform:"scale(.98)"},{opacity:1,transform:"scale(1.01)",offset:.55},{opacity:1,transform:"none"}],
        {duration:500,easing:"ease-out"});
      burst(band.getBoundingClientRect(),gi);
      setTimeout(openFact,400);
    },500);
  },rm?0:620);
}

function submit(){
  if(selected.size!==4||done||busy) return;
  const sel=[...selected], key=[...sel].sort().join("|");
  if(tried.has(key)){ toast("Déjà essayé"); return; }
  tried.add(key); history.push(sel.map(groupOf));
  const gi=groupOf(sel[0]), tiles=[...document.querySelectorAll(".tile.on")];
  if(sel.every(w=>groupOf(w)===gi)){
    foundGroup(gi,tiles);
  } else {
    mistakes++; buzz([40,40,40]);
    const c={}; sel.forEach(w=>c[groupOf(w)]=(c[groupOf(w)]||0)+1);
    if(Object.values(c).includes(3)) toast("Presque ! Un seul intrus",true);
    tiles.forEach(t=>{ t.classList.remove("shake","spring"); void t.offsetWidth; t.classList.add("shake"); });
    updateUi();
    if(mistakes>=maxErr){ busy=true; const id=gameId; setTimeout(()=>{ if(id===gameId) finish(false); },500); }
  }
}

function finish(win){
  done=true; selected.clear(); const id=gameId;
  const rest=[0,1,2,3].filter(gi=>!found.includes(gi)); let delay=0;
  rest.forEach(gi=>{ setTimeout(()=>{ if(id!==gameId) return;
    flipLayout(()=>{ addSolved(gi,false,"pop"); words=words.filter(w=>groupOf(w)!==gi);
      $("grid").querySelectorAll(".tile").forEach(t=>{ if(groupOf(t.dataset.w)===gi) t.remove(); }); }); },delay); delay+=380; });
  $("grid").querySelectorAll(".tile.on").forEach(t=>{ t.classList.remove("on"); t.setAttribute("aria-pressed",false); });
  const hide=()=>{ $("lives").style.display="none"; document.querySelector(".dock").style.display="none"; };
  if(rest.length) flipLayout(hide); else hide();
  const res=loadRes();
  if(!res[gridIdx]){ res[gridIdx]={win, mistakes}; saveRes(res); }
  if(!practice){
    const s=load();
    if(s.lastPlayed!==dayNum){
      s.played=(s.played||0)+1; s.lastPlayed=dayNum;
      if(win){ s.wins=(s.wins||0)+1; s.streak=(s.lastWin===dayNum-1?(s.streak||0):0)+1; s.lastWin=dayNum; s.best=Math.max(s.best||0,s.streak); }
      else s.streak=0;
      save(s);
    }
  }
  if(win) setTimeout(()=>{ if(id===gameId){ confetti(); buzz([20,40,20]); } },650);
  setTimeout(()=>{ if(id===gameId) openResults(win); },win?(RM()?600:1500):delay+700);
}

function load(){ try{ return JSON.parse(localStorage.getItem("quatuor"))||{}; }catch(e){ return {}; } }
function save(s){ try{ localStorage.setItem("quatuor",JSON.stringify(s)); }catch(e){} }
function statsHtml(){
  const s=load(), alive=s.lastWin===dayNum||s.lastWin===dayNum-1, pct=s.played?Math.round((s.wins||0)/s.played*100):0;
  return `<div class="stats"><div><b>${s.played||0}</b><small>parties</small></div><div><b>${pct}</b><small>% réussite</small></div>
    <div><b>${alive?(s.streak||0):0}</b><small>série 🔥</small></div><div><b>${s.best||0}</b><small>record</small></div></div>`;
}
function gridItem(i,r){
  const x=r[i], st = x ? (x.win?"win":"lost") : "";
  const sub = x ? (x.win ? (x.mistakes? `Réussie · ${x.mistakes} erreur${x.mistakes>1?"s":""}` : "Réussie sans faute") : "Perdue") : "À jouer";
  return `<button class="gitem ${st}${i===gridIdx?" cur":""}" data-i="${i}"><span class="num">${x?(x.win?"✓":"✗"):i+1}</span>
    <span class="txt"><b>Grille n°${i+1}</b><small>${sub}</small></span>${i===dailyIdx?'<span class="tag">Aujourd\'hui</span>':""}</button>`;
}
function renderMenu(anim){
  const r=loadRes(), tab=menuTab||grid.diff, ids=idsOf(tab), done_=ids.filter(i=>r[i]).length, D_=DIFFS[tab];
  const tabs=DKEYS.map(k=>{ const n=idsOf(k).filter(i=>r[i]).length;
    return `<button class="dtab${k===tab?" on":""}" data-k="${k}" role="tab" aria-selected="${k===tab}"><i class="l${DIFFS[k].c}"></i><b>${dname(k)}</b><small>${n}/${idsOf(k).length}</small></button>`; }).join("");
  $("drawer").innerHTML=`<h2>Grilles</h2>
    <p class="sec">Grille du jour</p><div class="glist">${gridItem(dailyIdx,r)}</div>
    <p class="sec">Choisis ta difficulté</p><div class="dtabs" role="tablist">${tabs}</div>
    <div class="dpane"><p class="prog">${done_} sur ${ids.length} terminées · <b>${D_.err} erreurs</b> autorisées</p>
    <div class="bar"><i style="width:${ids.length?done_/ids.length*100:0}%;background:var(--l${D_.c})"></i></div>
    <div class="glist">${ids.map(i=>gridItem(i,r)).join("")}</div></div>`;
  $("drawer").querySelectorAll(".gitem").forEach(b=>b.onclick=()=>{ closeSheet(); setTimeout(()=>switchGame(+b.dataset.i),150); });
  $("drawer").querySelectorAll(".dtab").forEach(b=>b.onclick=()=>{ if(b.dataset.k===tab) return; buzz(8); menuTab=b.dataset.k; renderMenu(true); });
  if(anim&&!RM()) $("drawer").querySelector(".dpane").animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],{duration:320,easing:"cubic-bezier(.2,.8,.3,1)"});
}
function openMenu(){
  menuTab=grid.diff; renderMenu(false);
  $("veil").classList.add("open"); $("drawer").classList.add("open");
}
function openSheet(html){ $("sheetBody").innerHTML=html; $("veil").classList.add("open"); $("sheet").classList.add("open"); }
function closeSheet(){ $("veil").classList.remove("open"); $("sheet").classList.remove("open"); $("drawer").classList.remove("open"); }
$("veil").onclick=closeSheet;

function openResults(win){
  const title = win ? (mistakes===0?"Sans faute !":"Bien joué !") : "Pas cette fois";
  const text = win ? `Grille résolue avec ${mistakes} erreur${mistakes>1?"s":""}.` : "Tous les groupes sont révélés.";
  let k=0; const recap = history.map(r=>`<div>${r.map(i=>`<i class="l${i}" style="--k:${k++}"></i>`).join("")}</div>`).join("");
  const learned = grid.map((g,i)=>`<div class="b${i}"><b>${esc(g.name)}</b>${esc(g.fact)}</div>`).join("");
  openSheet(`<h2>${title}</h2><p>${text}${practice?"":" Nouvelle grille demain."}</p>
    <div class="recap">${recap}</div>${practice?"":statsHtml()}
    <div class="row"><button class="pill main" id="share">Partager</button><button class="pill soft" id="next">Grille suivante</button></div>
    <h3>Ce que tu as appris aujourd'hui</h3><div class="learned">${learned}</div>`);
  $("share").onclick=share;
  $("next").onclick=()=>{ closeSheet(); const r=loadRes(); let i=gridIdx;
    const same=idsOf(grid.diff), pos=same.indexOf(gridIdx);
    for(let k=1;k<=same.length;k++){ const j=same[(pos+k)%same.length]; if(!r[j]){ i=j; break; } }
    if(i===gridIdx) for(let k=1;k<=GRIDS.length;k++){ const j=(gridIdx+k)%GRIDS.length; if(!r[j]){ i=j; break; } }
    if(i===gridIdx) i=same[(pos+1)%same.length];
    setTimeout(()=>switchGame(i),250); };
}
function openHelp(){
  openSheet(`<h2>Comment jouer</h2>
    <p class="lead">Range les 16 mots en <b>4 groupes de 4</b> qui ont un point commun.</p>
    <div class="rule"><span class="n">1</span><div>Touche 4 mots, puis <b>Valider</b>.</div></div>
    <div class="rule"><span class="n">2</span><div>Tu as droit à <b>4 erreurs</b> (3 en Difficile, 2 en GOAT 🐐). Gare aux pièges !</div></div>
    <div class="rule"><span class="n">3</span><div>Chaque groupe trouvé révèle une <b>anecdote</b>.</div></div>
    <div class="legend"><span class="t">La couleur d'un groupe indique sa difficulté :</span>
      <div class="sw">${LEVELS.map((l,i)=>`<span><i class="l${i}"></i>${l}</span>`).join("")}</div>
      <div class="ax"><span>plus facile</span><span>plus difficile →</span></div></div>
    <button class="pill main" style="width:100%" id="okHelp">Jouer</button>`);
  $("okHelp").onclick=closeSheet;
}
async function share(){
  const head=`Quatuor n°${gridIdx+1} · ${dname(grid.diff)}`;
  const text=`${head}\n${history.map(r=>r.map(i=>ICON[i]).join("")).join("\n")}`;
  if(navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e.name==="AbortError") return; } }
  try{ await navigator.clipboard.writeText(text); toast("Résultat copié"); }
  catch(e){ const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); toast("Résultat copié"); }catch(_){ toast("Copie impossible"); } t.remove(); }
}
let tt; function toast(m,bounce){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),1500);
  if(bounce&&!RM()) t.animate([{transform:"translate(-50%,-16px) scale(.97)",opacity:0},{transform:"translate(-50%,3px) scale(1.01)",opacity:1,offset:.6},
    {transform:"translate(-50%,0)",opacity:1}],{duration:550,easing:"ease-out"}); }

$("submit").onclick=submit;
$("shuffle").onclick=()=>{
  if(busy||done) return; buzz(10); shuffleArr(words);
  const g=$("grid"), m=new Map([...g.children].map(t=>[t.dataset.w,t]));
  flipLayout(()=>words.forEach(w=>g.appendChild(m.get(w))),{dur:560,stagger:15,lift:true});
  const s=$("shuffle"); s.classList.remove("spin"); void s.offsetWidth; s.classList.add("spin");
};
$("clear").onclick=()=>{
  if(busy||done) return; selected.clear();
  $("grid").querySelectorAll(".tile.on").forEach(t=>{ t.classList.remove("on"); t.setAttribute("aria-pressed",false); spring(t); });
  updateUi();
};
// Pas de zoom au double-tap
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
$("helpBtn").onclick=openHelp;
$("menuBtn").onclick=openMenu;
$("statsBtn").onclick=()=>{ openSheet(`<h2>Statistiques</h2><p>Grilles du jour uniquement.</p>${statsHtml()}<button class="pill main" style="width:100%" id="okS">Fermer</button>`); $("okS").onclick=closeSheet; };
let rt; addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>document.querySelectorAll(".tile").forEach(fit),150); });

newGame(dailyIdx);
try{ if(!localStorage.getItem("quatuor-seen")){ localStorage.setItem("quatuor-seen","1"); setTimeout(openHelp,300); } }catch(e){}
if("serviceWorker" in navigator){ addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{})); }
</script>
</body>
</html>
